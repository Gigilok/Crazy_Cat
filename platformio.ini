[env:esp32dev]
; PINADO EM v6.5.0 -> usa Arduino-ESP32 v2.0.17 (ESP-IDF v4.4)
; O codigo (wifi_bypass.cpp, BLE, SPI) foi escrito para v2.x.
; PlatformIO 7.x instala Arduino-ESP32 v3.x (ESP-IDF v5.x) que tem
; mudancas de API que quebram o bootloop (BLE NimBLE vs Bluedroid,
; assinatura de ieee80211_raw_frame_sanity_check, etc).
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv

build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -Wl,--gc-sections
    -Wl,-z,muldefs
    -DCONFIG_ESP_WIFI_80211_TX_SUPPORT=1
    -DCORE_DEBUG_LEVEL=5

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    nrf24/RF24 @ ^1.4.7
    bblanchon/ArduinoJson @ ^6.21.0
    LSatan/SmartRC-CC1101-Driver-Lib @ ^2.5.7
    sui77/rc-switch @ ^2.6.2
